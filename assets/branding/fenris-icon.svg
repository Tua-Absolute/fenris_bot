<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="65%">
      <stop offset="0" stop-color="#2a0a10"/>
      <stop offset=".7" stop-color="#0d0507"/>
      <stop offset="1" stop-color="#050505"/>
    </radialGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4a52"/>
      <stop offset="1" stop-color="#1c1c21"/>
    </linearGradient>
    <linearGradient id="muz" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6c6c76"/>
      <stop offset="1" stop-color="#3a3a42"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <g id="half">
      <!-- ear -->
      <path d="M146 64 C168 108 204 148 226 182 L166 206 C146 160 138 108 146 64Z" fill="#2c2c33"/>
      <path d="M156 104 C170 134 190 160 206 184 L172 196 C162 164 155 134 156 104Z" fill="#7a0c1a"/>
      <!-- head -->
      <path d="M256 184 C228 172 196 170 166 192 C138 212 120 244 110 282 C104 302 94 318 80 332 C108 334 132 344 152 358 C166 382 194 406 222 422 C236 432 248 438 256 440Z" fill="url(#fur)"/>
      <!-- cheek fur -->
      <path d="M114 272 C102 306 86 330 64 342 C96 346 124 354 152 366 C144 344 128 310 114 272Z" fill="#33333a"/>
      <path d="M130 318 C120 340 108 356 94 366 C118 366 140 372 160 384 C152 366 140 344 130 318Z" fill="#26262c"/>
      <!-- forehead blaze -->
      <path d="M256 194 C232 188 212 196 198 212 C222 222 240 240 248 266 L256 266Z" fill="#55555e"/>
      <!-- muzzle -->
      <path d="M256 262 C244 266 236 284 232 304 C228 330 228 350 232 364 C242 374 250 378 256 380Z" fill="url(#muz)"/>
      <!-- eye socket shadow -->
      <path d="M168 252 C192 248 218 260 238 280 C216 292 190 292 172 280 C166 272 164 262 168 252Z" fill="#121216"/>
      <!-- eye -->
      <path d="M180 262 C198 262 218 270 232 282 C214 288 196 288 186 280 C182 274 180 268 180 262Z" fill="#ff2236" filter="url(#glow)"/>
      <!-- brow -->
      <path d="M162 244 C192 234 224 248 248 276 L240 282 C218 260 192 250 164 254Z" fill="#0a0a0c"/>
      <!-- nose -->
      <path d="M256 348 C242 348 232 352 234 360 C238 370 248 378 256 380Z" fill="#070707"/>
    </g>
  </defs>

  <circle cx="256" cy="256" r="248" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="#c8102e" stroke-width="5"/>
  <circle cx="256" cy="256" r="224" fill="none" stroke="#c8102e" stroke-opacity=".25" stroke-width="2"/>

  <!-- broken chain (Gleipnir) -->
  <g fill="none" stroke-linecap="round">
    <g transform="rotate(-22 150 420)">
      <rect x="86" y="406" width="64" height="28" rx="14" stroke="#c8102e" stroke-width="9"/>
      <rect x="138" y="413" width="44" height="14" rx="7" stroke="#8e0b20" stroke-width="9"/>
      <path d="M176 410 h10 a10 10 0 0 1 10 10" stroke="#c8102e" stroke-width="9"/>
    </g>
    <g transform="rotate(22 362 420)">
      <rect x="362" y="406" width="64" height="28" rx="14" stroke="#c8102e" stroke-width="9"/>
      <rect x="330" y="413" width="44" height="14" rx="7" stroke="#8e0b20" stroke-width="9"/>
      <path d="M336 410 h-10 a10 10 0 0 0 -10 10" stroke="#c8102e" stroke-width="9"/>
    </g>
  </g>

  <use href="#half"/>
  <use href="#half" transform="translate(512 0) scale(-1 1)"/>
</svg>
