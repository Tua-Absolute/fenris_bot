<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="65%">
      <stop offset="0" stop-color="#2a0a10"/>
      <stop offset="1" stop-color="#050505"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="256" cy="256" r="248" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="#c8102e" stroke-width="5"/>
  <circle cx="256" cy="256" r="224" fill="none" stroke="#c8102e" stroke-opacity=".18" stroke-width="2"/>

  <!-- broken chain (Gleipnir) -->
  <g fill="none" stroke-linecap="round">
    <g transform="rotate(-22 150 420)">
      <rect x="86" y="406" width="64" height="28" rx="14" stroke="#c8102e" stroke-width="9"/>
      <rect x="138" y="413" width="44" height="14" rx="7" stroke="#8e0b20" stroke-width="9"/>
      <path d="M176 410 h10 a10 10 0 0 1 10 10 v0" stroke="#c8102e" stroke-width="9"/>
    </g>
    <g transform="rotate(22 362 420)">
      <rect x="362" y="406" width="64" height="28" rx="14" stroke="#c8102e" stroke-width="9"/>
      <rect x="330" y="413" width="44" height="14" rx="7" stroke="#8e0b20" stroke-width="9"/>
      <path d="M336 410 h-10 a10 10 0 0 0 -10 10 v0" stroke="#c8102e" stroke-width="9"/>
    </g>
  </g>

  <!-- ears -->
  <polygon points="138,78 214,178 124,222" fill="#4a4a52"/>
  <polygon points="138,78 214,178 176,190" fill="#2c2c33"/>
  <polygon points="152,120 192,180 150,198" fill="#7a0c1a"/>
  <polygon points="374,78 298,178 388,222" fill="#4a4a52"/>
  <polygon points="374,78 298,178 336,190" fill="#2c2c33"/>
  <polygon points="360,120 320,180 362,198" fill="#7a0c1a"/>

  <!-- head base -->
  <polygon points="124,222 205,172 256,192 307,172 388,222 404,300 340,338 300,404 256,436 212,404 172,338 108,300" fill="#2c2c33"/>
  <!-- cheek ruffs -->
  <polygon points="108,300 172,338 150,360 92,322" fill="#4a4a52"/>
  <polygon points="404,300 340,338 362,360 420,322" fill="#4a4a52"/>
  <polygon points="124,222 172,338 108,300" fill="#3e3e46"/>
  <polygon points="388,222 340,338 404,300" fill="#3e3e46"/>
  <!-- forehead -->
  <polygon points="205,172 256,192 307,172 286,252 256,262 226,252" fill="#5e5e68"/>
  <!-- brow shadows -->
  <polygon points="124,222 205,172 226,252 182,262" fill="#36363d"/>
  <polygon points="388,222 307,172 286,252 330,262" fill="#36363d"/>
  <!-- muzzle -->
  <polygon points="226,252 256,262 286,252 296,360 256,384 216,360" fill="#74747e"/>
  <polygon points="182,262 226,252 216,360 172,338" fill="#1c1c21"/>
  <polygon points="330,262 286,252 296,360 340,338" fill="#1c1c21"/>
  <!-- jaw -->
  <polygon points="172,338 216,360 256,384 296,360 340,338 300,404 256,436 212,404" fill="#121216"/>
  <polygon points="216,360 256,384 296,360 284,398 256,412 228,398" fill="#4a4a52"/>
  <!-- nose -->
  <polygon points="234,350 278,350 256,374" fill="#050505"/>

  <!-- eyes -->
  <g filter="url(#glow)" fill="#ff2236">
    <polygon points="178,262 230,276 192,290"/>
    <polygon points="334,262 282,276 320,290"/>
  </g>
</svg>
