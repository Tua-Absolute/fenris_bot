<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <rect width="1200" height="400" fill="#0a1220"/>
  <g transform="translate(40 40) scale(0.625)">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="65%">
      <stop offset="0" stop-color="#1d2f4a"/>
      <stop offset="1" stop-color="#0a1220"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="256" cy="256" r="248" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="#7fd4ff" stroke-opacity=".55" stroke-width="4"/>
  <circle cx="256" cy="256" r="224" fill="none" stroke="#7fd4ff" stroke-opacity=".18" stroke-width="2"/>

  <!-- broken chain (Gleipnir) -->
  <g fill="none" stroke-linecap="round">
    <g transform="rotate(-22 150 420)">
      <rect x="86" y="406" width="64" height="28" rx="14" stroke="#e8b84a" stroke-width="9"/>
      <rect x="138" y="413" width="44" height="14" rx="7" stroke="#c99a30" stroke-width="9"/>
      <path d="M176 410 h10 a10 10 0 0 1 10 10 v0" stroke="#e8b84a" stroke-width="9"/>
    </g>
    <g transform="rotate(22 362 420)">
      <rect x="362" y="406" width="64" height="28" rx="14" stroke="#e8b84a" stroke-width="9"/>
      <rect x="330" y="413" width="44" height="14" rx="7" stroke="#c99a30" stroke-width="9"/>
      <path d="M336 410 h-10 a10 10 0 0 0 -10 10 v0" stroke="#e8b84a" stroke-width="9"/>
    </g>
  </g>

  <!-- ears -->
  <polygon points="138,78 214,178 124,222" fill="#9fb0c3"/>
  <polygon points="138,78 214,178 176,190" fill="#6d7f95"/>
  <polygon points="152,120 192,180 150,198" fill="#2b3a50"/>
  <polygon points="374,78 298,178 388,222" fill="#9fb0c3"/>
  <polygon points="374,78 298,178 336,190" fill="#6d7f95"/>
  <polygon points="360,120 320,180 362,198" fill="#2b3a50"/>

  <!-- head base -->
  <polygon points="124,222 205,172 256,192 307,172 388,222 404,300 340,338 300,404 256,436 212,404 172,338 108,300" fill="#6d7f95"/>
  <!-- cheek ruffs -->
  <polygon points="108,300 172,338 150,360 92,322" fill="#9fb0c3"/>
  <polygon points="404,300 340,338 362,360 420,322" fill="#9fb0c3"/>
  <polygon points="124,222 172,338 108,300" fill="#8496ab"/>
  <polygon points="388,222 340,338 404,300" fill="#8496ab"/>
  <!-- forehead -->
  <polygon points="205,172 256,192 307,172 286,252 256,262 226,252" fill="#c9d6e3"/>
  <!-- brow shadows -->
  <polygon points="124,222 205,172 226,252 182,262" fill="#7d8fa5"/>
  <polygon points="388,222 307,172 286,252 330,262" fill="#7d8fa5"/>
  <!-- muzzle -->
  <polygon points="226,252 256,262 286,252 296,360 256,384 216,360" fill="#dfe8f1"/>
  <polygon points="182,262 226,252 216,360 172,338" fill="#47566b"/>
  <polygon points="330,262 286,252 296,360 340,338" fill="#47566b"/>
  <!-- jaw -->
  <polygon points="172,338 216,360 256,384 296,360 340,338 300,404 256,436 212,404" fill="#2b3a50"/>
  <polygon points="216,360 256,384 296,360 284,398 256,412 228,398" fill="#9fb0c3"/>
  <!-- nose -->
  <polygon points="234,350 278,350 256,374" fill="#0a1220"/>

  <!-- eyes -->
  <g filter="url(#glow)" fill="#7fd4ff">
    <polygon points="178,262 230,276 192,290"/>
    <polygon points="334,262 282,276 320,290"/>
  </g>
</g>
  <text x="400" y="225" font-family="Inter Display, Inter, DejaVu Sans, Liberation Sans, Arial, sans-serif" font-weight="700" font-size="128" letter-spacing="22" fill="#dfe8f1">FENRIS</text>
  <rect x="404" y="258" width="64" height="5" fill="#e8b84a"/>
  <text x="484" y="268" font-family="Inter Display, Inter, DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="30" letter-spacing="8" fill="#7fd4ff">SERVER MANAGEMENT</text>
</svg>